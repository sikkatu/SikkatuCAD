[package]
name = "cadbridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[lib]
name = "cadbridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
acadrust = { version = "0.5.5", features = ["serde"] }
serde_json = "1"
jni = "0.21"

[profile.release]
opt-level = "s"
lto = true
strip = true

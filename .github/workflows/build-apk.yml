name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bridge

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Rust host tests
        run: cd rust-bridge && cargo test --release

      - name: Build Rust bridge for Android
        run: cd rust-bridge && cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CadPocketViewer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk